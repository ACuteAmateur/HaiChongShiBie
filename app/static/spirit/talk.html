<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>田野AI精灵</title>
  <!-- <link rel="icon" href="favicon.ico" type="image/x-icon"> 可选：小图标 -->
  <link rel="stylesheet" href="talk.css">
</head>

<body>
  <div class="dialog-window">
    <div class="dialog-header">
      <span>田园智囊百问💡</span>
    </div>
    <div class="dialog-body">
      <div id="chatBox" class="chat-box"></div>
      <div class="input-container">
        <input type="text" id="userInput" class="user-input" placeholder="请输入你的问题...">
        <button id="sendBtn" class="send-btn">发送</button>
        <button id="clearBtn" class="clear-btn">清空</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
